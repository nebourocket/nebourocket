<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Nebou Rocket — space and AI">
  <defs>
    <radialGradient id="sky" cx="72%" cy="45%" r="85%">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset="0.55" stop-color="#0b0a1f"/>
      <stop offset="1" stop-color="#05050d"/>
    </radialGradient>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7b5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#9fe7ff"/>
      <stop offset="0.5" stop-color="#3a7bd5"/>
      <stop offset="1" stop-color="#141a4a"/>
    </radialGradient>
    <style>
      .tw { animation: tw 4s ease-in-out infinite; }
      .d1 { animation-delay: 1s; } .d2 { animation-delay: 2s; } .d3 { animation-delay: 3s; }
      @keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .9 } }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>
  <ellipse cx="880" cy="170" rx="360" ry="200" fill="url(#nebula)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="60" cy="40" r="1"/><circle cx="140" cy="300" r="1.2" class="tw"/>
    <circle cx="210" cy="80" r="0.8"/><circle cx="330" cy="320" r="1" class="tw d2"/>
    <circle cx="420" cy="30" r="1.3" class="tw d1"/><circle cx="520" cy="290" r="0.8"/>
    <circle cx="600" cy="60" r="1" class="tw d3"/><circle cx="680" cy="330" r="1.2"/>
    <circle cx="740" cy="30" r="0.8" class="tw d2"/><circle cx="1060" cy="50" r="1.4" class="tw"/>
    <circle cx="1140" cy="140" r="0.9"/><circle cx="1110" cy="310" r="1.2" class="tw d1"/>
    <circle cx="990" cy="330" r="0.8"/><circle cx="1170" cy="230" r="1" class="tw d3"/>
    <circle cx="30" cy="190" r="0.8" class="tw d2"/><circle cx="560" cy="170" r="0.7"/>
  </g>

  <!-- neural constellation -->
  <g stroke="#b9a8ff" stroke-width="1" stroke-opacity="0.45" fill="none">
    <path d="M1010 70 L1070 110 L1130 80 M1070 110 L1100 170 L1150 190 M1100 170 L1040 200"/>
    <path d="M700 250 L760 290 L820 260 M760 290 L740 330"/>
  </g>
  <g fill="#d9ceff" class="pulse">
    <circle cx="1010" cy="70" r="3"/><circle cx="1070" cy="110" r="3.5"/><circle cx="1130" cy="80" r="2.5"/>
    <circle cx="1100" cy="170" r="3"/><circle cx="1150" cy="190" r="2.5"/><circle cx="1040" cy="200" r="2.5"/>
    <circle cx="700" cy="250" r="2.5"/><circle cx="760" cy="290" r="3"/><circle cx="820" cy="260" r="2.5"/><circle cx="740" cy="330" r="2"/>
  </g>

  <!-- planet + orbit -->
  <ellipse cx="900" cy="180" rx="150" ry="38" fill="none" stroke="#7fd3ff" stroke-opacity="0.25" transform="rotate(-18 900 180)"/>
  <circle cx="900" cy="180" r="62" fill="url(#planet)"/>
  <g transform="rotate(-18 900 180)">
    <circle r="5" fill="#ffd27f">
      <animateMotion dur="20s" repeatCount="indefinite" path="M1050 180 A150 38 0 1 1 750 180 A150 38 0 1 1 1050 180"/>
    </circle>
  </g>

  <!-- text -->
  <text x="80" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="2">Nebou Rocket</text>
  <text x="84" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#a9b4ff" letter-spacing="6">SPACE  ×  AI</text>
</svg>
